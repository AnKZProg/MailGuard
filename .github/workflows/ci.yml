name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is pinned to windows-2022 rather than left
        # floating: a newer Windows/Visual Studio image broke node-gyp's
        # VS-detection when compiling better-sqlite3 from source (no
        # prebuilt binary was available for the runner's Node patch
        # version), with "unknown version... could not find any Visual
        # Studio installation to use" even though VS was present.
        os: [ubuntu-latest, windows-2022]
    env:
      # .npmrc pins script-shell to the Windows Git Bash path used by the
      # local launcher (Lancer-MailGuard.bat). That path is also correct on
      # GitHub's windows runners, so only override it on Linux, where npm
      # lifecycle scripts (e.g. postinstall -> prisma generate) would
      # otherwise fail to find that path.
      npm_config_script_shell: ${{ matrix.os == 'windows-2022' && 'C:\Program Files\Git\bin\bash.exe' || '/bin/bash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up local SQLite schema
        # The root layout queries the DB (security findings count) even for
        # static pages like /_not-found, so `next build` needs a real schema
        # on disk — not just a directory. `prisma db push` creates both.
        run: npm run db:push

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the Zod env schema validates during a
          # build-only CI run. These are not real secrets and are never
          # used to reach a live provider.
          MAILGUARD_ENCRYPTION_KEY: "XA+SCHAH++Ny85SXoAxff7mbre7/brpPLttxlnQrF/A="
          GOOGLE_CLIENT_ID: "ci-placeholder-google-client-id"
          GOOGLE_CLIENT_SECRET: "ci-placeholder-google-client-secret"
          MICROSOFT_CLIENT_ID: "ci-placeholder-microsoft-client-id"
          MICROSOFT_CLIENT_SECRET: "ci-placeholder-microsoft-client-secret"

      - name: Typecheck
        # Runs after `build` because Next.js 16 generates the `.next/types/`
        # global types (RouteContext, LayoutProps, etc.) that tsconfig.json
        # includes — a standalone tsc run before any build fails on them.
        run: npm run typecheck
